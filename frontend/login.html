<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Cyber Capivaras</title>
    <link rel="icon" type="image/png" href="imgs/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="login-logo" href="index.html">
        <img src="imgs/apple-touch-icon.png" alt="Cyber Capivaras" />
      </a>
      <section class="login-box">
        <h1>Bem-vindo</h1>
        <p>Acesso exclusivo com conta Google da equipe Cyber Capivaras</p>
        <form id="loginForm" class="login-form">
          <div id="googleSignIn" class="google-signin-slot"></div>
          <button class="google-demo-button" id="googleDemoButton" type="button">
            <span>G</span>
            Entrar com Google
          </button>
          <div class="form-row">
            <label class="check-label">
              <input type="checkbox" name="remember" />
              Manter conectado
            </label>
            <a href="index.html">Voltar ao site</a>
          </div>
          <p class="login-help">
            O login oficial usa Google. Enquanto o Client ID nao estiver configurado, este botao simula a entrada para desenvolvimento.
          </p>
          <p class="form-status" id="loginStatus" role="status"></p>
        </form>
      </section>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js"></script>
  </body>
</html>
