<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Cyber Capivaras</title>
    <link rel="icon" type="image/png" href="imgs/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#080a0f" />
    <link rel="apple-touch-icon" href="imgs/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css?v=20260610-font" />
  </head>
  <body class="login-screen">
    <main class="login-layout">
      <section class="login-intro">
        <a class="brand large" href="index.html">
          <img src="imgs/ChatGPT Image 2 de jul. de 2025, 18_59_21-Photoroom.png" alt="Cyber Capivaras" />
          <span>Cyber Capivaras</span>
        </a>
        <h1>App interno do time</h1>
        <p>Administra projetos, tarefas, equipe, conteudo publico e comunicados em um so lugar.</p>
      </section>

      <section class="login-panel">
        <p class="eyebrow">Acesso</p>
        <h2>Entrar no app</h2>
        <button class="google-button" id="googleDemoButton" type="button">
          <span>G</span>
          Entrar com Google
        </button>
        <div id="googleSignIn"></div>
        <p class="login-note" id="googleStatus">Configure o Google Client ID para ativar o login oficial.</p>

        <form class="admin-login" id="adminLoginForm">
          <div class="divider"><span>admin</span></div>
          <label>E-mail <input type="email" name="email" placeholder="admin@cybercapivaras.com" /></label>
          <label>Senha <input type="password" name="password" placeholder="Senha do administrador" /></label>
          <button class="button primary" type="submit">Entrar como admin</button>
          <p class="form-status" id="loginStatus" role="status"></p>
        </form>
      </section>
    </main>

    <script src="config.js?v=20260610-app"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js?v=20260610-pwa-tickets"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js?v=20260610-pwa-tickets"></script>
  </body>
</html>
